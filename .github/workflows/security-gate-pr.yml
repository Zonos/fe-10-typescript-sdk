name: Security Gate (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  security-events: read
  issues: write
  pull-requests: write

jobs:
  SecurityGate:
    name: Security gate
    uses: Zonos/github-actions/.github/workflows/frontend-security-gate-pr.yml@v1
    with:
      audit_targets: '[{"path":".","package_manager":"pnpm"}]'
    secrets:
      DEPENDABOT_READ_ONLY_TOKEN: ${{ secrets.DEPENDABOT_READ_ONLY_TOKEN }}
